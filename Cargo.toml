[workspace]
resolver = "3"
members = ["crates/majin-protocol", "crates/majin-pty", "crates/majin-server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/s-yoshiki/majin"
authors = ["Yoshiki Shinagawa"]

[workspace.dependencies]
majin-protocol = { path = "crates/majin-protocol" }
majin-pty = { path = "crates/majin-pty" }

anyhow = "1"
thiserror = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"

[profile.release]
# The web artifact ships as a single downloadable binary, so size matters more
# than the last few percent of throughput.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
