name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The desktop crate is part of the Cargo workspace, so even `cargo check`
      # needs the webview headers present.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm run lint:js

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: TypeScript
        run: pnpm run typecheck

      - name: Rust tests
        run: cargo test --workspace

      # The TypeScript protocol types are generated from the Rust ones. If this
      # step fails, run `pnpm generate:protocol` and commit the result.
      - name: Generated protocol types are up to date
        run: |
          pnpm run generate:protocol
          git diff --exit-code -- packages/protocol/src/generated \
            || { echo "::error::Generated protocol types are stale. Run 'pnpm generate:protocol' and commit."; exit 1; }

      - name: Build the web bundle
        run: pnpm run build:web

      - name: End-to-end smoke test
        run: pnpm run test:e2e
